name: Refresh GIS data

on:
  schedule:
    - cron: '0 3 * * 1'    # every Monday 03:00 UTC - rescue + fire + catasto + cyclepaths + peaks + hospital
    - cron: '0 3 1 * *'    # 1st of each month 03:00 UTC - base + community
  workflow_dispatch:
    inputs:
      target:
        description: 'Makefile target'
        required: true
        default: 'rescue'
        type: choice
        options: [rescue, fire, catasto, cyclepaths, peaks, hospital, base, community, green-refresh, green-refresh-sentinel2, fetch-sentinel2, fetch-landsat]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt
        working-directory: pipeline

      # rasterio/boto3/etc. are only needed for the monthly satellite refresh
      # (green-refresh) and its two fetch-only targets (used to test each API
      # in isolation), not the lighter CI-safe targets above.
      - name: Install green-refresh dependencies
        if: >-
          github.event.schedule == '0 3 1 * *' ||
          (github.event_name == 'workflow_dispatch' && contains(
            fromJSON('["green-refresh", "green-refresh-sentinel2", "fetch-sentinel2", "fetch-landsat"]'),
            github.event.inputs.target
          ))
        run: pip install -r requirements-green-ci.txt
        working-directory: pipeline

      # tippecanoe isn't packaged for Ubuntu; build the maintained fork. Only
      # needed when the run touches catasto (weekly, or that manual target).
      - name: Install tippecanoe
        if: >-
          github.event.schedule == '0 3 * * 1' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'catasto')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev
          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)"
          sudo make -C /tmp/tippecanoe install

      - name: Weekly refresh (rescue + fire + catasto + cyclepaths + peaks + hospital)
        if: github.event.schedule == '0 3 * * 1'
        run: make rescue fire catasto cyclepaths peaks hospital
        working-directory: pipeline

      - name: Monthly refresh (base + community)
        if: github.event.schedule == '0 3 1 * *'
        run: make base community
        working-directory: pipeline

      - name: Monthly satellite refresh (NDVI/NBR/LST)
        if: github.event.schedule == '0 3 1 * *'
        continue-on-error: true # a bad month here shouldn't block base/community above
        run: make green-refresh
        working-directory: pipeline
        env:
          CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
          USGS_USERNAME: ${{ secrets.USGS_USERNAME }}
          USGS_TOKEN: ${{ secrets.USGS_TOKEN }}

      - name: Manual target
        if: github.event_name == 'workflow_dispatch'
        run: make ${{ github.event.inputs.target }}
        working-directory: pipeline
        env:
          CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
          USGS_USERNAME: ${{ secrets.USGS_USERNAME }}
          USGS_TOKEN: ${{ secrets.USGS_TOKEN }}

      - name: Commit updated data
        # No [skip ci]: the data commit lands on main and Vercel auto-deploys
        # from there, so the refreshed layers actually go live.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || git commit -m "chore: auto-refresh GIS data"
          git push
