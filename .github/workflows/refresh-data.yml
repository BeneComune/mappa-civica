name: Refresh GIS data

on:
  schedule:
    - cron: '0 3 * * 1'    # every Monday 03:00 UTC - rescue + fire + catasto + cyclepaths + peaks + hospital
    - cron: '0 3 1 * *'    # 1st of each month 03:00 UTC - base
  workflow_dispatch:
    inputs:
      target:
        description: 'Makefile target'
        required: true
        default: 'rescue'
        type: choice
        options: [rescue, fire, catasto, cyclepaths, peaks, hospital, base]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements-ci.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt
        working-directory: pipeline

      - name: Weekly refresh (rescue + fire + catasto + cyclepaths + peaks + hospital)
        if: github.event.schedule == '0 3 * * 1'
        run: make rescue fire catasto cyclepaths peaks hospital
        working-directory: pipeline

      - name: Monthly refresh (base)
        if: github.event.schedule == '0 3 1 * *'
        run: make base
        working-directory: pipeline

      - name: Manual target
        if: github.event_name == 'workflow_dispatch'
        run: make ${{ github.event.inputs.target }}
        working-directory: pipeline

      - name: Commit updated data
        # No [skip ci]: the data commit lands on main and Vercel auto-deploys
        # from there, so the refreshed layers actually go live.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || git commit -m "chore: auto-refresh GIS data"
          git push
